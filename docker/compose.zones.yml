# =============================================================================
# Compose project name: zones
# Tạo 4 zone mạng kiểu DMZ.
# Prefer: npm run docker:zones:up  →  node docker/scripts/ensure-zones.js
# Fallback: file này có service noop để `docker compose up` không báo "no service selected".
# =============================================================================

name: zones

networks:
  zone-frontend:
    name: zone-frontend
    driver: ${DOCKER_NETWORK_DRIVER:-bridge}
    labels:
      demo.zone: frontend
      demo.role: dmz-public

  zone-backend:
    name: zone-backend
    driver: ${DOCKER_NETWORK_DRIVER:-bridge}
    labels:
      demo.zone: backend
      demo.role: app-tier

  zone-platform:
    name: zone-platform
    driver: ${DOCKER_NETWORK_DRIVER:-bridge}
    labels:
      demo.zone: platform
      demo.role: shared-services

  zone-data:
    name: zone-data
    driver: ${DOCKER_NETWORK_DRIVER:-bridge}
    labels:
      demo.zone: data
      demo.role: data-tier

services:
  # No-op: chỉ để `compose up` tạo networks (không publish port).
  zone-init:
    image: alpine:3.20
    container_name: zones-init
    command: ["true"]
    networks: [zone-frontend, zone-backend, zone-platform, zone-data]
    restart: "no"
