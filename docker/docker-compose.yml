# NATS JetStream 3-node + MailDev SMTP catcher
#   docker compose -f docker/docker-compose.yml up -d
# Client:
#   NATS_URL=nats://127.0.0.1:14222,nats://127.0.0.1:14223,nats://127.0.0.1:14224
# Mail UI: http://127.0.0.1:1080
# SMTP:    127.0.0.1:1025

x-nats: &nats
  image: nats:2.10-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/varz"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  nats-1:
    <<: *nats
    container_name: demo-nats-1
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "14222:4222"
      - "18222:8222"
    volumes:
      - ./nats/nats-1.conf:/etc/nats/nats.conf:ro
      - demo_nats1:/data

  nats-2:
    <<: *nats
    container_name: demo-nats-2
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "14223:4222"
      - "18223:8222"
    volumes:
      - ./nats/nats-2.conf:/etc/nats/nats.conf:ro
      - demo_nats2:/data

  nats-3:
    <<: *nats
    container_name: demo-nats-3
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "14224:4222"
      - "18224:8222"
    volumes:
      - ./nats/nats-3.conf:/etc/nats/nats.conf:ro
      - demo_nats3:/data

  maildev:
    image: maildev/maildev:2.1.0
    container_name: demo-maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: unless-stopped

volumes:
  demo_nats1:
  demo_nats2:
  demo_nats3:
