# =============================================================================
# Compose project name: frontend
# Windows container — zone-frontend only (DMZ public)
# Browser → :5173 → (optional) proxy /api → gateway trên cùng zone-frontend
# =============================================================================

name: frontend

networks:
  zone-frontend:
    external: true
    name: zone-frontend

services:
  web:
    isolation: ${WINDOWS_ISOLATION:-process}
    container_name: frontend-web
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.windows
      args:
        WINDOWS_BASE: ${WINDOWS_BASE:-mcr.microsoft.com/windows/servercore:ltsc2019}
    restart: unless-stopped
    networks:
      - zone-frontend
    environment:
      # Rỗng = browser dùng same-origin /api (proxy zone-frontend → gateway)
      DEMO_GATEWAY: ${DEMO_GATEWAY:-}
      GATEWAY_PROXY_HOST: gateway
      GATEWAY_PROXY_PORT: "7080"
      PORT: "8080"
    ports:
      - "5173:8080"
