# =============================================================================
# Server: pull backend images (không build). Cùng zone multi-homed.
# Prerequisite: docker login + zones + data + platform
#   IMAGE_BASE=registry.portlogics.com.vn/demo-smtp/linux
#   IMAGE_TAG=20260916-0130
#   docker compose --env-file .env -p backend -f docker/compose.backend.pull.yml pull
#   docker compose --env-file .env -p backend -f docker/compose.backend.pull.yml up -d
# =============================================================================

name: backend

networks:
  zone-frontend:
    external: true
    name: zone-frontend
  zone-backend:
    external: true
    name: zone-backend
  zone-platform:
    external: true
    name: zone-platform
  zone-data:
    external: true
    name: zone-data

x-common-env: &common-env
  NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
  NATS_JETSTREAM_REPLICAS: ${NATS_JETSTREAM_REPLICAS:-3}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  EMAIL_HOST: ${EMAIL_HOST_DOCKER:-maildev}
  EMAIL_PORT: ${EMAIL_PORT_DOCKER:-1025}
  EMAIL_ENABLE_SSL: ${EMAIL_ENABLE_SSL:-false}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-demo@localhost}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Demo Portal}
  POSTGRES_HOST: postgres-primary
  POSTGRES_PORT: "5432"

services:
  gateway:
    container_name: backend-gateway
    image: ${IMAGE_BASE:-registry.portlogics.com.vn/demo-smtp/linux}/gateway:${IMAGE_TAG:-demo}
    pull_policy: always
    restart: unless-stopped
    networks: [zone-frontend, zone-backend, zone-platform, zone-data]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: demo-gateway
      GATEWAY_PORT: "7080"
    ports:
      - "7080:7080"

  recaptcha-service:
    container_name: backend-recaptcha-service
    image: ${IMAGE_BASE:-registry.portlogics.com.vn/demo-smtp/linux}/recaptcha-service:${IMAGE_TAG:-demo}
    pull_policy: always
    restart: unless-stopped
    networks: [zone-backend, zone-platform, zone-data]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: demo-recaptcha-service

  smtp-service:
    container_name: backend-smtp-service
    image: ${IMAGE_BASE:-registry.portlogics.com.vn/demo-smtp/linux}/smtp-service:${IMAGE_TAG:-demo}
    pull_policy: always
    restart: unless-stopped
    networks: [zone-backend, zone-platform, zone-data]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: demo-smtp-service
